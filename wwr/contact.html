<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rapids & Rivers Rafting Co. for inquiries, reservations, or suggestions. Reach us by phone, email, or through our online contact form.">
    <meta name="author" content="Selassie Kwabla Heloo">
    <title>Contact Us | Rapids & Rivers Rafting Co.</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="page-contact">
    <header>
        <img src="images/logo.png" alt="Rapids & Rivers Rafting Co. logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="current">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
        </section>

        <div class="contact-layout">
            <div class="contact-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3058.123456789!2d-112.1234567!3d37.1234567!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDA3JzI0LjQiTiAxMTLCsDA3JzI0LjQiVw!5e0!3m2!1sen!2sus!4v1234567890"
                  width="400" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade" title="Company Location Map">
                </iframe>
            </div>

            <div class="contact-form">
                <form action="#" method="post">
                    <div class="contact-form-group">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" name="name" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="contact-form-group">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="email"
                          placeholder="Placeholder" required>
                    </div>

                    <div class="contact-form-group">
                        <label>Message Purpose</label>
                        <div class="contact-choice-group">
                            <label for="contact-general">
                                <input type="radio" id="contact-general" name="purpose"
                                  value="general" checked>
                                General Inquiry
                            </label>
                            <label for="contact-reservation">
                                <input type="radio" id="contact-reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>
                            <label for="contact-suggestion">
                                <input type="radio" id="contact-suggestion" name="purpose"
                                  value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="contact-form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" rows="4"
                          placeholder="Type here" required></textarea>
                    </div>

                    <div class="contact-form-group contact-choice-group contact-checkbox-group">
                        <label for="contact-newsletter">
                            <input type="checkbox" id="contact-newsletter" name="newsletter">
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <section class="contact-employees">
            <h2>We Are Here to Serve You</h2>
            <div class="contact-employee-grid">
                <figure>
                    <img src="images/peter.jpg" alt="Peter Ben - Rafting Guide">
                    <figcaption>Peter Ben</figcaption>
                </figure>
                <figure>
                    <img src="images/joe.jpg" alt="Joe Mattins - Trip Coordinator">
                    <figcaption>Joe Mattins</figcaption>
                </figure>
                <figure>
                    <img src="images/derick.jpg" alt="Derick Sams - Safety Instructor">
                    <figcaption>Derick Sams</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 Rapids &amp; Rivers Rafting Co. Built by Selassie Kwabla Heloo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
