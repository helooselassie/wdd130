<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>☑ Basic HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <div class="question">
                <label for="q1"><span class="q-number">1.</span> What does the acronym CSS stand
                    for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="question">
                <label for="q2"><span class="q-number">2.</span> How are id and class attributes
                    selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <div class="question">
                <label for="q3"><span class="q-number">3.</span> Which of the following is a valid
                    CSS comment?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="1">&lt;!-- This is a comment --&gt;</option>
                    <option value="2">/* This is a comment */</option>
                    <option value="3">// This is a comment</option>
                    <option value="4"># This is a comment</option>
                </select>
            </div>

            <div class="question">
                <label for="q4"><span class="q-number">4.</span> What is the bottom margin given
                    this declaration?</label>
                <div class="code-block">
                    <code>margin: 10px 5px 15px;</code>
                </div>
                <input type="number" id="q4" name="q4" required>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
